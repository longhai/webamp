<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webamp</title>
<style>html,body{margin:0;padding:0;overflow:hidden}</style>
</head>
<body>
<div id="app"></div>
<script src="webamp.bundle.min.js"></script>
<script>
    (function(){
        try {
            const orig = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, options){
                if(type === '2d'){
                    options = options || {};
                    if(!('willReadFrequently' in options)) options.willReadFrequently = true;
                }
                return orig.call(this, type, options);
            };
        } catch(e){}
    })();
    </script>
    <script src="butterchurn.min.js"></script>
<script src="butterchurnPresets.min.js"></script>
<script src="hls.min.js"></script>
<script>
    const app = document.getElementById("app")
    let _savedSkinUrl = null;
    try { _savedSkinUrl = localStorage.getItem('webamp-saved-skin-url'); } catch(e){}
    try { if(_savedSkinUrl && _savedSkinUrl.includes('Winamp5_Classified')){ _savedSkinUrl = 'skins/Winamp5_Classified_v5.5.wsz'; try { localStorage.setItem('webamp-saved-skin-url', _savedSkinUrl); } catch(e){} } } catch(e){}
    const _skins = [
            {name: "Green Dimension V2", url: "Green Dimension V2.wsz"},
            {name: "Internet Archive", url: "Internet Archive.wsz"},
            {name: "Mac OSX v1.5 (Aqua)", url: "Mac OSX v1.5 (Aqua).wsz"},
            {name: "TopazAmp", url: "TopazAmp.wsz"},
            {name: "Vizor", url: "Vizor.wsz"},
            {name: "XMMS Turquoise", url: "XMMS Turquoise.wsz"},
            {name: "Zaxon Remake", url: "Zaxon Remake.wsz"},
            {name: "Winamp5 Classified", url: "skins/Winamp5_Classified_v5.5.wsz"}
        ];
    let _hlsAudio = null;
    let _hlsInstance = null;
    let _hlsActive = false;
    let _hlsBlobUrl = null;
    let _hlsNativeSrc = '';
    try {
        const _origCreateObjectURL = URL.createObjectURL;
        URL.createObjectURL = function(obj){
            const url = _origCreateObjectURL.call(URL, obj);
            try {
                if(typeof MediaSource !== 'undefined' && obj instanceof MediaSource){
                    _hlsBlobUrl = url;
                }
            } catch(e){}
            return url;
        };
    } catch(e){}
    try {
        const _origCreateElement = document.createElement.bind(document);
        document.createElement = function(tag, opts){
            const el = _origCreateElement(tag, opts);
            try {
                if(typeof tag === 'string' && tag.toLowerCase() === 'audio' && !_hlsAudio){
                    _hlsAudio = el;
                    let _desc = null;
                    let _p = Object.getPrototypeOf(el);
                    while(_p && !_desc){
                        _desc = Object.getOwnPropertyDescriptor(_p, 'src');
                        _p = Object.getPrototypeOf(_p);
                    }
                    const _nativeSet = _desc && _desc.set ? _desc.set : null;
                    const _nativeGet = _desc && _desc.get ? _desc.get : null;
                    if(_nativeSet){
                        Object.defineProperty(el, 'src', {
                            configurable: true,
                            get: function(){
                                try { return _nativeGet ? _nativeGet.call(el) : _hlsNativeSrc; } catch(err){ return _hlsNativeSrc; }
                            },
                            set: function(url){
                                try {
                                    if(url && url === _hlsBlobUrl){
                                        _nativeSet.call(el, url);
                                        _hlsNativeSrc = url;
                                        return;
                                    }
                                    const isM3u8 = !!(url && typeof url === 'string' && url.toLowerCase().split('?')[0].split('#')[0].endsWith('.m3u8'));
                                    if(isM3u8){
                                        if(window.Hls && window.Hls.isSupported()){
                                            _hlsActive = true;
                                            if(!_hlsInstance){
                                                _hlsInstance = new window.Hls({maxBufferLength: 30});
                                                try { _hlsInstance.attachMedia(el); } catch(err){}
                                                try {
                                                    _hlsInstance.on(window.Hls.Events.ERROR, function(ev, data){
                                                        try {
                                                            if(data && data.fatal){
                                                                if(data.type === window.Hls.ErrorTypes.NETWORK_ERROR){
                                                                    try { _hlsInstance.startLoad(); } catch(err2){}
                                                                } else if(data.type === window.Hls.ErrorTypes.MEDIA_ERROR){
                                                                    try { _hlsInstance.recoverMediaError(); } catch(err2){}
                                                                }
                                                            }
                                                        } catch(err2){}
                                                    });
                                                } catch(err){}
                                            } else {
                                                try {
                                                    if(!_hlsInstance.media){
                                                        _hlsInstance.attachMedia(el);
                                                    }
                                                } catch(err){}
                                            }
                                            try { _hlsInstance.loadSource(url); } catch(err){}
                                            return;
                                        }
                                        _hlsActive = false;
                                        _nativeSet.call(el, url);
                                        _hlsNativeSrc = url;
                                        return;
                                    }
                                    if(_hlsActive && _hlsInstance){
                                        try { _hlsInstance.detachMedia(); } catch(err){}
                                        _hlsActive = false;
                                    }
                                    _nativeSet.call(el, url);
                                    _hlsNativeSrc = url;
                                } catch(err){
                                    try { if(_nativeSet) _nativeSet.call(el, url); } catch(err2){}
                                }
                            }
                        });
                    }
                }
            } catch(e){}
            return el;
        };
    } catch(e){}
    const webamp = new Webamp({
        availableSkins: _skins,
        initialSkin: _savedSkinUrl ? {url: _savedSkinUrl} : undefined,
        __butterchurnOptions: {
            importButterchurn: () => Promise.resolve(window.butterchurn),
            getPresets: () => {
                try {
                    const all = window.butterchurnPresets.getPresets();
                    const names = Object.keys(all);
                    return Promise.resolve(names.map(name => ({name: name, butterchurnPresetObject: all[name]})));
                } catch(e){ return Promise.resolve([]); }
            }
        }
    });
    let __zoomed = false;
    function applyZoom(){
        const w = document.getElementById('webamp');
        if(!w) return;
        if(!__zoomed){
            try {
                const _f = document.getElementById('pl-big-font'); if(_f) _f.remove();
            } catch(e){}
            try {
                const orig = window.__origPlSize || [0, 0];
                webamp.store.dispatch({type:'WINDOW_SIZE_CHANGED', windowId:'playlist', size:orig});
                const xC = Math.round((window.innerWidth - 275) / 2);
                const plH0 = 116 + (orig[1] || 0) * 29;
                webamp.store.dispatch({type:'UPDATE_WINDOW_POSITIONS', positions:{main:{x:xC,y:0}, equalizer:{x:xC,y:116}, playlist:{x:xC,y:232}, milkdrop:{x:xC,y:232+plH0}}, absolute:true});
            } catch(e){}
            w.style.transform = 'scale(1)';
            w.style.position = 'absolute'; w.style.left = '0px'; w.style.top = '0px'; w.style.margin = '0px';
            document.body.style.height = ''; document.body.style.overflow = '';
            return;
        }
        try {
            const vw = window.innerWidth, vh = window.innerHeight;
            const scaleX = vw / 275;
            const _mainH = (typeof __mainShaded !== 'undefined' && __mainShaded) ? 14 : 116;
            let bestEh = 0, bestDiff = 1e9;
            for(let eh=0; eh<=40; eh++){
                const total = _mainH + 116 + 116 + eh * 29;
                const sy = vh / total;
                const diff = Math.abs(sy - scaleX);
                if(diff < bestDiff){ bestDiff = diff; bestEh = eh; }
            }
            webamp.store.dispatch({type:'WINDOW_SIZE_CHANGED', windowId:'playlist', size:[0, bestEh]});
            try {
                const plH = 116 + bestEh * 29;
                webamp.store.dispatch({type:'UPDATE_WINDOW_POSITIONS', positions:{main:{x:0,y:0}, equalizer:{x:0,y:_mainH}, playlist:{x:0,y:_mainH+116}, milkdrop:{x:0,y:_mainH+116+plH}}, absolute:true});
            } catch(e){}
            const totalH = ((typeof __mainShaded !== 'undefined' && __mainShaded) ? 14 : 116) + 116 + 116 + bestEh * 29;
            const scaleY = vh / totalH;
            const diffRatio = scaleX ? Math.abs(scaleY - scaleX) / scaleX : 1;
            if(diffRatio <= 0.05){
                w.style.position = 'absolute';
                w.style.left = '0px';
                w.style.top = '0px';
                w.style.margin = '0px';
                w.style.transformOrigin = 'top left';
                w.style.transform = 'scale(' + scaleX + ', ' + scaleY + ')';
            } else {
                const scaleU = Math.min(scaleX, scaleY);
                const pw = 275 * scaleU;
                const ph = totalH * scaleU;
                const leftC = Math.round((vw - pw) / 2);
                const topC = Math.round((vh - ph) / 2);
                w.style.position = 'absolute';
                w.style.left = leftC + 'px';
                w.style.top = topC + 'px';
                w.style.transformOrigin = 'top left';
                w.style.transform = 'scale(' + scaleU + ', ' + scaleU + ')';
            }
            document.body.style.height = vh + 'px';
            document.body.style.overflow = 'hidden';
            document.body.style.overflowX = 'hidden';
        } catch(e){}
    }
    function toggleZoom(e){
        if(e){ e.preventDefault(); e.stopPropagation(); }
        if(!__zoomed){
            try {
                const st = webamp.store.getState();
                const sz = st.windows && st.windows.genWindows && st.windows.genWindows.playlist ? st.windows.genWindows.playlist.size : [0, 0];
                window.__origPlSize = sz;
            } catch(err){}
        }
        __zoomed = !__zoomed;
        setTimeout(applyZoom, 300);
        setTimeout(applyZoom, 1000);
    }
    let __mainShaded = false;
    function pickTitleButton(cx, cy){
        try {
            const tb = document.getElementById('title-bar');
            const mn = document.getElementById('minimize');
            const sh = document.getElementById('shade');
            const cl = document.getElementById('close');
            if(!tb || !mn || !sh || !cl) return null;
            const tr = tb.getBoundingClientRect();
            if(cy < tr.top - 12 || cy > tr.bottom + 12) return null;
            const mr = mn.getBoundingClientRect(), sr = sh.getBoundingClientRect(), cr = cl.getBoundingClientRect();
            if(cx < mr.left - 14 || cx > cr.right + 14) return null;
            const mc = mr.left + mr.width / 2, sc = sr.left + sr.width / 2, cc = cr.left + cr.width / 2;
            const dm = Math.abs(cx - mc), ds = Math.abs(cx - sc), dc = Math.abs(cx - cc);
            if(dm <= ds && dm <= dc) return 'minimize';
            if(ds <= dc) return 'shade';
            return 'close';
        } catch(e){ return null; }
    }
    document.addEventListener('click', (e) => {
        const pb = pickTitleButton(e.clientX, e.clientY);
        const sh = pb ? (pb === 'shade') : (e.target && e.target.closest ? !!e.target.closest('#shade') : false);
        if(pb === 'minimize'){ toggleZoom(e); return; }
        if(pb === 'close'){ e.preventDefault(); e.stopPropagation(); return; }
        if(!sh) return;
        e.preventDefault(); e.stopPropagation();
        try { webamp.store.dispatch({type:'TOGGLE_WINDOW_SHADE_MODE', windowId:'main'}); } catch(err){}
        __mainShaded = !__mainShaded;
        setTimeout(() => {
            try {
                if(__zoomed){
                    applyZoom();
                    return;
                }
                const xC = Math.round((window.innerWidth - 275) / 2);
                const orig = window.__origPlSize || [0, 0];
                const plH = 116 + (orig[1] || 0) * 29;
                if(__mainShaded){
                    webamp.store.dispatch({type:'UPDATE_WINDOW_POSITIONS', positions:{main:{x:xC,y:0}, equalizer:{x:xC,y:14}, playlist:{x:xC,y:130}, milkdrop:{x:xC,y:130+plH}}, absolute:true});
                } else {
                    webamp.store.dispatch({type:'UPDATE_WINDOW_POSITIONS', positions:{main:{x:xC,y:0}, equalizer:{x:xC,y:116}, playlist:{x:xC,y:232}, milkdrop:{x:xC,y:232+plH}}, absolute:true});
                }
            } catch(err2){}
        }, 200);
    }, true);
    document.addEventListener('click', (e) => {
        const d = e.target && e.target.closest ? e.target.closest('#button-d') : null;
        if(d){ toggleZoom(e); }
    }, true);
    document.addEventListener('touchend', (e) => {
        const d = e.target && e.target.closest ? e.target.closest('#button-d') : null;
        if(d){ toggleZoom(e); }
    }, true);
    document.addEventListener('touchend', (e) => {
        try {
            const tc = e.changedTouches && e.changedTouches[0];
            if(!tc) return;
            const pb = pickTitleButton(tc.clientX, tc.clientY);
            if(pb === 'minimize'){ toggleZoom(e); }
        } catch(err){}
    }, true);
    document.addEventListener('click', (e) => {
        const cl = e.target && e.target.closest ? e.target.closest('#close, #equalizer-close, #playlist-close, .gen-close') : null;
        if(cl){ e.preventDefault(); e.stopPropagation(); }
    }, true);
    const _style = document.createElement('style');
    _style.textContent = '#shade::after, #minimize::after, #button-d::after{content:none !important}';
    document.head.appendChild(_style);
    document.addEventListener('click', (e) => {
        try {
            const txt = e.target && e.target.textContent ? e.target.textContent.trim() : '';
            const found = _skins.find(s => s.name === txt);
            if(found){ localStorage.setItem('webamp-saved-skin-url', found.url); }
            if(txt === '<Base Skin>'){ localStorage.removeItem('webamp-saved-skin-url'); }
        } catch(err){}
    }, true);
    webamp.renderWhenReady(app).then(() => {
        try { const w0 = document.getElementById('webamp'); if(w0){ w0.style.position = 'absolute'; w0.style.left = '0px'; w0.style.top = '0px'; w0.style.margin = '0px'; } } catch(e){} try { webamp.setVolume(100); } catch(e){}
        try {
            const loadSaved = () => {
                try {
                    const saved = localStorage.getItem('webamp-saved-tracks');
                    if(saved){ const sl = JSON.parse(saved); if(sl && sl.length) webamp.appendTracks(sl); }
                } catch(e){}
            };
            const isAudio = (n) => /\.(mp3|wav|flac|ogg|m4a|opus)$/i.test(n);
            const toTracks = (names) => names.filter(isAudio).sort((a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'})).map(n => ({metaData:{artist:'', title: n.replace(/\.[^.]+$/, '')}, url: 'mp3/' + encodeURIComponent(n)}));
            const tryGithubApi = async () => {
                try {
                    const host = location.hostname;
                    if(!/\.github\.io$/.test(host)) return null;
                    const user = host.split('.')[0];
                    const parts = location.pathname.split('/').filter(Boolean);
                    let dir;
                    if(location.pathname.endsWith('/')) dir = parts;
                    else if(parts.length && parts[parts.length-1].includes('.')) dir = parts.slice(0, -1);
                    else dir = parts;
                    const cands = [];
                    if(dir.length >= 1){
                        cands.push({repo: user + '/' + dir[0], path: dir.slice(1).concat(['mp3']).join('/')});
                        if(dir.slice(1).length) cands.push({repo: user + '/' + dir[0], path: 'mp3'});
                    }
                    cands.push({repo: user + '/' + user + '.github.io', path: dir.concat(['mp3']).join('/')});
                    for(const c of cands){
                        try {
                            const r = await fetch('https://api.github.com/repos/' + c.repo + '/contents/' + c.path);
                            if(!r.ok) continue;
                            const arr = await r.json();
                            if(!Array.isArray(arr)) continue;
                            const names = arr.filter(x => x.type === 'file').map(x => x.name);
                            const tracks = toTracks(names);
                            if(tracks.length) return tracks;
                        } catch(e){}
                    }
                    return null;
                } catch(e){ return null; }
            };
            const tryDirListing = async () => {
                try {
                    const r = await fetch('mp3/');
                    if(!r.ok) return null;
                    const html = await r.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    const names = Array.from(doc.querySelectorAll('a')).map(a => decodeURIComponent(a.getAttribute('href') || '')).map(h => h.split('/').filter(Boolean).pop()).filter(Boolean);
                    const tracks = toTracks(names);
                    return tracks.length ? tracks : null;
                } catch(e){ return null; }
            };
            const parseM3u = (text, fallback) => {
                const out = [];
                const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
                let pending = null;
                for(const raw of lines){
                    const line = raw.trim();
                    if(!line) continue;
                    if(line.startsWith('#EXTINF:')){
                        const idx = line.indexOf(',');
                        pending = idx >= 0 ? line.slice(idx + 1).trim() : null;
                        continue;
                    }
                    if(line.startsWith('#')) continue;
                    let url = line;
                    if(!/^https?:\/\//i.test(url)){
                        url = url.startsWith('/') ? url : 'radio/' + url;
                    }
                    out.push({metaData:{artist:'', title: pending || fallback}, url: url});
                    pending = null;
                }
                return out;
            };
            const tryRadioApi = async () => {
                try {
                    const host = location.hostname;
                    if(!/\.github\.io$/.test(host)) return null;
                    const user = host.split('.')[0];
                    const parts = location.pathname.split('/').filter(Boolean);
                    let dir;
                    if(location.pathname.endsWith('/')) dir = parts;
                    else if(parts.length && parts[parts.length-1].includes('.')) dir = parts.slice(0, -1);
                    else dir = parts;
                    const cands = [];
                    if(dir.length >= 1){
                        cands.push({repo: user + '/' + dir[0], path: dir.slice(1).concat(['radio']).join('/')});
                        if(dir.slice(1).length) cands.push({repo: user + '/' + dir[0], path: 'radio'});
                    }
                    cands.push({repo: user + '/' + user + '.github.io', path: dir.concat(['radio']).join('/')});
                    for(const c of cands){
                        try {
                            const r = await fetch('https://api.github.com/repos/' + c.repo + '/contents/' + c.path);
                            if(!r.ok) continue;
                            const arr = await r.json();
                            if(!Array.isArray(arr)) continue;
                            const names = arr.filter(x => x.type === 'file').map(x => x.name).filter(n => /\.m3u8?$/i.test(n));
                            if(names.length) return names;
                        } catch(e){}
                    }
                    return null;
                } catch(e){ return null; }
            };
            const tryRadio = async () => {
                try {
                    let names = await tryRadioApi();
                    if(!names){
                        try {
                            const r = await fetch('radio/');
                            if(r.ok){
                                const html = await r.text();
                                const doc = new DOMParser().parseFromString(html, 'text/html');
                                names = Array.from(doc.querySelectorAll('a')).map(a => decodeURIComponent(a.getAttribute('href') || '')).map(h => h.split('/').filter(Boolean).pop()).filter(Boolean).filter(n => /\.m3u8?$/i.test(n));
                            }
                        } catch(e){}
                    }
                    if(!names || !names.length) return [];
                    const out = [];
                    for(const name of names){
                        try {
                            const r = await fetch('radio/' + encodeURIComponent(name));
                            if(!r.ok) continue;
                            const text = await r.text();
                            const fallback = name.replace(/\.m3u8?$/i, '');
                            const tracks = parseM3u(text, fallback);
                            for(const tr of tracks) out.push(tr);
                        } catch(e){}
                    }
                    return out;
                } catch(e){ return []; }
            };
            (async () => {
                let tracks = await tryGithubApi();
                if(!tracks) tracks = await tryDirListing();
                let base = [];
                if(tracks && tracks.length){
                    base = tracks;
                    try { localStorage.setItem('webamp-saved-tracks', JSON.stringify(tracks)); } catch(e){}
                    try { webamp.appendTracks(tracks); } catch(e){}
                } else {
                    try {
                        const r = await fetch('songs.json');
                        const list = r.ok ? await r.json() : null;
                        if(list && list.length){
                            base = list;
                            try { localStorage.setItem('webamp-saved-tracks', JSON.stringify(list)); } catch(e){}
                            try { webamp.appendTracks(list); } catch(e){}
                        } else loadSaved();
                    } catch(e){ loadSaved(); }
                }
                const radioTracks = await tryRadio();
                if(radioTracks.length){
                    try { webamp.appendTracks(radioTracks); } catch(e){}
                    try {
                        const combined = base.concat(radioTracks);
                        if(combined.length) localStorage.setItem('webamp-saved-tracks', JSON.stringify(combined));
                    } catch(e){}
                }
            })();
        } catch(e){}
        try {
            webamp.store.subscribe(() => {
                try {
                    const st = webamp.store.getState();
                    const order = st.playlist && st.playlist.trackOrder ? st.playlist.trackOrder : [];
                    if(!order.length) return;
                    const media = st.tracks || st.media || {};
                    const isLocal = (id) => {
                        const m = media[id];
                        return m && m.url && typeof m.url === 'string' && m.url.startsWith('blob:');
                    };
                    const localIds = order.filter(isLocal);
                    if(!localIds.length) return;
                    if(order.length === localIds.length) return;
                    const webIds = order.filter(id => !isLocal(id));
                    if(webIds.length) webamp.store.dispatch({type:'REMOVE_TRACKS', ids: webIds});
                } catch(e){}
            });
        } catch(e){}
        try {
            const savedEq = localStorage.getItem('webamp-saved-eq');
            if(savedEq){
                const eq = JSON.parse(savedEq);
                if(eq.sliders){
                    for(const band in eq.sliders){
                        try { webamp.store.dispatch({type:'SET_BAND_VALUE', band: band, value: eq.sliders[band]}); } catch(e){}
                    }
                }
                if(eq.on === false){ try { webamp.store.dispatch({type:'SET_EQ_OFF'}); } catch(e){} }
                if(eq.on === true){ try { webamp.store.dispatch({type:'SET_EQ_ON'}); } catch(e){} }
                if(typeof eq.auto !== 'undefined'){ try { webamp.store.dispatch({type:'SET_EQ_AUTO', value: eq.auto}); } catch(e){} }
            }
        } catch(e){}
        let _lastEqJson = '';
        try {
            webamp.store.subscribe(() => {
                try {
                    const eq = webamp.store.getState().equalizer;
                    const j = JSON.stringify(eq);
                    if(j !== _lastEqJson){ _lastEqJson = j; localStorage.setItem('webamp-saved-eq', j); }
                } catch(e){}
            });
        } catch(e){}
        try {
            let _repeatMode = 0;
            let _repeatSeekAt = 0;
            let _prevTrackId = null;
            let _manualChangeAt = 0;
            let _reverting = false;
            const _updateRepeatIndicator = () => {
                try {
                    const btn = document.getElementById('repeat');
                    if(!btn) return;
                    btn.style.filter = _repeatMode === 2 ? 'hue-rotate(270deg)' : '';
                } catch(e){}
            };
            document.addEventListener('click', (e) => {
                try {
                    const btn = e.target && e.target.closest ? e.target.closest('#repeat') : null;
                    if(!btn) return;
                    e.preventDefault();
                    e.stopPropagation();
                    _repeatMode = (_repeatMode + 1) % 3;
                    _updateRepeatIndicator();
                    try {
                        const st = webamp.store.getState();
                        const rep = !!(st.media && st.media.repeat);
                        if(_repeatMode === 0 && rep) webamp.store.dispatch({type:'TOGGLE_REPEAT'});
                        if(_repeatMode !== 0 && !rep) webamp.store.dispatch({type:'TOGGLE_REPEAT'});
                    } catch(err){}
                } catch(err){}
            }, true);
            document.addEventListener('click', (e) => {
                try {
                    const nav = e.target && e.target.closest ? e.target.closest('#next, #previous, .playlist-track') : null;
                    if(nav) _manualChangeAt = Date.now();
                } catch(err){}
            }, true);
            webamp.store.subscribe(() => {
                try {
                    const st = webamp.store.getState();
                    const rep = !!(st.media && st.media.repeat);
                    if(rep && _repeatMode === 0){
                        _repeatMode = 1;
                        _updateRepeatIndicator();
                        return;
                    }
                    if(!rep && _repeatMode !== 0){
                        _repeatMode = 0;
                        _updateRepeatIndicator();
                        return;
                    }
                    _updateRepeatIndicator();
                    const cur = st.playlist && st.playlist.currentTrack;
                    if(_prevTrackId === null){
                        _prevTrackId = cur;
                    } else if(cur !== _prevTrackId){
                        if(_reverting){
                            _prevTrackId = cur;
                            _reverting = false;
                        } else if(_repeatMode === 2 && Date.now() - _manualChangeAt > 2000){
                            const back = _prevTrackId;
                            _reverting = true;
                            webamp.store.dispatch({type:'PLAY_TRACK', id:back});
                            return;
                        } else {
                            _prevTrackId = cur;
                        }
                    }
                    if(_repeatMode !== 2) return;
                    if(st.media.status !== 'PLAYING') return;
                    if(cur === null || cur === undefined) return;
                    const tr = st.tracks && st.tracks[cur];
                    const dur = tr && tr.duration;
                    if(!dur || dur <= 0) return;
                    const el = st.media.timeElapsed;
                    if(typeof el !== 'number') return;
                    if(el < dur - 0.5) return;
                    const now = Date.now();
                    if(now - _repeatSeekAt < 2000) return;
                    _repeatSeekAt = now;
                    webamp.store.dispatch({type:'SEEK_TO_PERCENT_COMPLETE', percent:0});
                } catch(e){}
            });
            _updateRepeatIndicator();
        } catch(e){}
        try {
            webamp.store.dispatch({type:'ENABLE_MILKDROP', open:false});
            webamp.store.dispatch({type:'SET_MILKDROP_DESKTOP', enabled:true});
        } catch(e){}
    });
</script>
</body>
</html>
